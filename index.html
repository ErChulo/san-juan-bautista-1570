<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Reconstrucción geográfico-histórica de la jurisdicción eclesiástica de San Juan Bautista del Boriquén hacia 1570, con áreas insulares y cálculos geodésicos." />
  <meta name="theme-color" content="#183842" />
  <title>San Juan Bautista del Boriquén en 1570</title>
  <script>
    (() => {
      const isGitHubPages = location.hostname.endsWith('github.io');
      const base = isGitHubPages ? '/san-juan-bautista-1570/' : '/';
      window.__SITE_BASE__ = base;
      try {
        const saved = localStorage.getItem('sjb-theme');
        const systemDark = matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = saved || (systemDark ? 'dark' : 'light');
      } catch (_) {
        document.documentElement.dataset.theme = 'light';
      }
      const css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = base + 'styles.css';
      document.head.appendChild(css);
    })();
  </script>

</head>
<body>
  <div id="app"></div>
  <script>
    (() => {
      const js = document.createElement('script');
      js.type = 'module';
      js.src = (window.__SITE_BASE__ || '/') + 'app.js';
      document.body.appendChild(js);
    })();
